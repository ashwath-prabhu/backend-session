service: users

frameworkVersion: '3'

plugins:
  - serverless-esbuild
  - serverless-offline

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  memorySize: 128
  timeout: 10

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node

functions:
  hello:
    handler: src/handlers/hello.hello
    events:
      - httpApi:
          path: /hello
          method: get
